name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Steps read the Go version from here. A version written into a setup-go
  # step would be updated as a GitHub Actions dependency and labelled internal.
  # renovate: datasource=golang-version depName=go
  GO_VERSION: 1.27.1
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0
  # Use the Go that setup-go installed and never download another one.
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # There is no go.sum for the cache to key on.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test ./...

  # Tests on the oldest Go the README says the tool builds with. The version
  # comes from the go directive in go.mod.
  floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  # Runs the release build with a test version and checks what it produces.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: 0.0.0-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build binaries
        run: scripts/build.sh "$VERSION"
      - name: Write Homebrew formula
        run: scripts/formula.sh "$VERSION" dist > dist/stick-history.rb
      - name: Check the archives and the checksum file
        run: |
          for file in \
            "stick-history_${VERSION}_darwin_arm64.tar.gz" \
            "stick-history_${VERSION}_darwin_amd64.tar.gz" \
            "stick-history_${VERSION}_linux_amd64.tar.gz" \
            "stick-history_${VERSION}_windows_amd64.zip" \
            SHA256SUMS
          do
            [ -s "dist/$file" ] || { echo "dist/$file is missing or empty" >&2; exit 1; }
            [ "$file" = SHA256SUMS ] || grep -q " $file\$" dist/SHA256SUMS \
              || { echo "SHA256SUMS has no line for $file" >&2; exit 1; }
          done
          cd dist && sha256sum --check SHA256SUMS
      - name: Check the formula
        run: |
          [ -s dist/stick-history.rb ] || { echo "dist/stick-history.rb is missing or empty" >&2; exit 1; }
          ruby -c dist/stick-history.rb
          for target in darwin_arm64 darwin_amd64 linux_amd64; do
            sum=$(awk -v f="stick-history_${VERSION}_${target}.tar.gz" '$2 == f { print $1 }' dist/SHA256SUMS)
            [ -n "$sum" ] || { echo "SHA256SUMS has no checksum for $target" >&2; exit 1; }
            grep -q "sha256 \"$sum\"" dist/stick-history.rb \
              || { echo "the formula does not carry the $target checksum" >&2; exit 1; }
          done
      - name: Run the built binary
        run: |
          tar -xzf "dist/stick-history_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          got=$("$RUNNER_TEMP/stick-history_${VERSION}_linux_amd64/stick-history" --version)
          [ "$got" = "stick-history $VERSION" ] \
            || { echo "--version printed \"$got\", want \"stick-history $VERSION\"" >&2; exit 1; }
