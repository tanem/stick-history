name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: 1.27.1
  # Use the Go that setup-go installed and never download another one.
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # There is no go.sum for the cache to key on.
          cache: false
      - run: go test ./...
      - name: Build binaries
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Write Homebrew formula
        run: scripts/formula.sh "${GITHUB_REF_NAME#v}" dist > dist/stick-history.rb
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
